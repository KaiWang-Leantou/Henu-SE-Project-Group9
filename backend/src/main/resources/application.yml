server:
  port: 8080

spring:
  application:
    name: whiteboard-backend
  # 默认使用 dev（H2 文件库）；生产演示用 --spring.profiles.active=mysql
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      # Flyway 是表结构唯一真源，禁止 Hibernate 自动改表
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 兼容已有手工建表的旧库：非空库先建立基线，再增量执行 V2
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

wb:
  auth:
    # 本期强制 WS 携带 token；保留配置位，供二期匿名协作开关使用
    allow-anonymous: false
  jwt:
    # 生产通过环境变量 WB_JWT_SECRET 注入；缺失时 JwtService 使用 dev 默认值并打 WARN
    secret: ${WB_JWT_SECRET:}
    ttl-hours: 12
