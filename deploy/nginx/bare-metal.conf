# 裸机部署用：前端静态 + 反向代理 /api 与 /ws
# 放到 /etc/nginx/conf.d/whiteboard.conf
# 用法见 deploy/README.md

# WebSocket 升级必须的两行；没有这个 map，/ws 会 400/426
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream wb_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;                 # 有域名就换成 your.domain.com

    root /var/www/whiteboard;      # 前端 dist 解压到这里
    index index.html;

    client_max_body_size 4m;       # 缩略图上限 256KB，留余量

    # ---- REST ----
    location /api/ {
        proxy_pass http://wb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ---- WebSocket（关键）----
    location /ws {
        proxy_pass http://wb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        proxy_read_timeout 3600s;  # 长连接别被 60s 默认值掐断
        proxy_send_timeout 3600s;
        proxy_buffering off;       # 实时消息不缓冲
    }

    # ---- 健康检查 ----
    location /actuator/health {
        proxy_pass http://wb_backend;
        access_log off;
    }

    # ---- 静态资源缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA 路由回退（/login /works /board/xxx 都落到 index.html）----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
